#
# Development setup (Phase 1). A one-command install with generated secrets comes in Phase 3.
#
#   1. Create orbitos/docker/.env containing:  ORBITOS_DB_PASSWORD=<a long random value>
#   2. docker build -f orbitos/docker/Dockerfile -t orbitos/orbitos:dev .
#   3. docker compose -f orbitos/docker/compose.yml --profile install run --rm orbitos-install   (first time only)
#   4. docker compose -f orbitos/docker/compose.yml up -d
#   5. Open http://localhost:8080
#
# All ports are bound to this computer only (127.0.0.1). The database has no published port.

name: orbitos

x-orbitos-env: &orbitos-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orbitos
  SPRING_DATASOURCE_USERNAME: orbitos
  SPRING_DATASOURCE_PASSWORD: ${ORBITOS_DB_PASSWORD:?Set ORBITOS_DB_PASSWORD in orbitos/docker/.env}
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbitos
      POSTGRES_USER: orbitos
      POSTGRES_PASSWORD: ${ORBITOS_DB_PASSWORD:?Set ORBITOS_DB_PASSWORD in orbitos/docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitos -d orbitos"]
      interval: 5s
      timeout: 5s
      retries: 20

  orbitos-install:
    image: orbitos/orbitos:dev
    profiles: ["install"]
    environment:
      <<: *orbitos-env
      ORBITOS_INSTALL: "true"
    depends_on:
      postgres:
        condition: service_healthy

  orbitos:
    image: orbitos/orbitos:dev
    restart: unless-stopped
    environment:
      <<: *orbitos-env
    volumes:
      - orbitos-data:/var/lib/orbitos
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:5683:5683/udp"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  orbitos-data:
