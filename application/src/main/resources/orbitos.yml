#
# OrbitOS defaults that differ from upstream. This file is imported by thingsboard.yml
# and takes precedence over it. Each value can still be set with the same environment
# variable as upstream. See UPSTREAM_PATCHES.md for why each value differs.

# No outbound calls: the IoT Hub marketplace is off unless a URL is set.
iot-hub:
  base-url: "${IOT_HUB_BASE_URL:}"

# Edge support is off: it adds a gRPC port (7070) and menus for a separate product.
# Set EDGES_ENABLED=true to turn it on.
edges:
  enabled: "${EDGES_ENABLED:false}"

ui:
  help:
    # Help pages are served from this server, never fetched from the internet.
    base-url: "${UI_HELP_BASE_URL:/assets}"

orbitos:
  i18n:
    # Language for emails to users who have not chosen one (en_US, en_CA, fr_FR or fr_CA).
    default-language: "${ORBITOS_DEFAULT_LANGUAGE:en_US}"
  branding:
    # Folder holding branding.yml, the logo and the favicon.
    dir: "${ORBITOS_BRANDING_DIR:/etc/orbitos/branding}"
    # Product name shown everywhere; empty = the name in branding.yml.
    name: "${ORBITOS_BRAND_NAME:}"
  offline:
    # The web interface may only load data from this server. true = also allow the free
    # map tile servers (OpenStreetMap, Esri, CARTO): the browser then contacts them.
    online-maps: "${ORBITOS_ONLINE_MAPS:false}"
    # Other hosts the web interface may load data from, separated by spaces or commas.
    allowed-hosts: "${ORBITOS_ALLOWED_HOSTS:}"

# Tamper-evident audit log: every entry is added to a hash chain (see orbitos/docs/en/privacy-security.md).
# Set AUDIT_LOG_SINK_TYPE=none to turn it off, or elasticsearch for the upstream external sink.
audit-log:
  sink:
    type: "${AUDIT_LOG_SINK_TYPE:orbitos-chain}"

# Retention (privacy by design: keep data only as long as needed). Values in seconds; 0 = keep forever.
# Telemetry and alarm retention per organization are in the organization profile (365 days by default).
sql:
  ttl:
    ts:
      ts_key_value_ttl: "${SQL_TTL_TS_TS_KEY_VALUE_TTL:31536000}"   # telemetry fallback: 365 days
    events:
      events_ttl: "${SQL_TTL_EVENTS_EVENTS_TTL:2592000}"           # rule engine events: 30 days
    audit_logs:
      ttl: "${SQL_TTL_AUDIT_LOGS_SECS:31536000}"                   # audit log: 365 days

# API reference page (/swagger-ui.html): no vendor contact or links. The brand name is applied by
# org.thingsboard.server.orbitos.branding.OpenApiBranding.
swagger:
  title: "${SWAGGER_TITLE:REST API}"
  description: "${SWAGGER_DESCRIPTION:REST API reference}"
  contact:
    name: "${SWAGGER_CONTACT_NAME:}"
    url: "${SWAGGER_CONTACT_URL:}"
    email: "${SWAGGER_CONTACT_EMAIL:}"
  license:
    url: "${SWAGGER_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0}"
  group_name: "${SWAGGER_GROUP_NAME:api}"

# No links to the upstream vendor's mobile app in app stores (OrbitOS has no mobile app yet).
mobileApp:
  googlePlayLink: "${TB_MOBILE_APP_GOOGLE_PLAY_LINK:}"
  appStoreLink: "${TB_MOBILE_APP_APP_STORE_LINK:}"
