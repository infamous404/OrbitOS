<button mat-icon-button type="button" tabindex="-1" (click)="togglePassword($event)" [attr.aria-pressed]="showPassword" *ngIf="!hideToggle"
        [attr.aria-label]="'orbitos.show-password' | translate">
  <mat-icon aria-hidden="true">{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
</button>
